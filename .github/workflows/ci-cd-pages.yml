name: CI/CD & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore GenesisAltivonSys.sln

    - name: Build Solution (Release)
      run: dotnet build GenesisAltivonSys.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test GenesisAltivonSys.sln --configuration Release --no-build --verbosity normal

  deploy-frontend-pages:
    needs: build-backend-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: FrontEnd/package-lock.json

    - name: Install dependencies
      working-directory: ./FrontEnd
      run: npm ci

    - name: Build Frontend
      working-directory: ./FrontEnd
      run: npm run build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './FrontEnd/build'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4