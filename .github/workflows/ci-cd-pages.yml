name: CI/CD & Cloudflare Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore GenesisAltivonSys.sln

    - name: Build Solution (Release)
      run: dotnet build GenesisAltivonSys.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test GenesisAltivonSys.sln --configuration Release --no-build --verbosity normal

  deploy-cloudflare-pages:
    needs: build-backend-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: FrontEnd/package-lock.json

    - name: Install dependencies
      working-directory: ./FrontEnd
      run: npm ci

    - name: Build Frontend
      working-directory: ./FrontEnd
      run: npm run build

    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy FrontEnd/dist --project-name=genesis-altivon-sys